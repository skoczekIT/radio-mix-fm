<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Mix FM  Maximum Volume</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0055;
            --secondary: #7000ff;
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Blokada zaznaczania tekstu na całej stronie */
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(112,0,255,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            top: -100px;
            right: -100px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            z-index: 1000;
            top: 0;
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .logo span { color: var(--primary); }

        .nav-links { list-style: none; display: flex; gap: 30px; }
        .nav-links a { text-decoration: none; color: var(--text); font-weight: 500; transition: 0.3s; opacity: 0.7; }
        .nav-links a:hover { opacity: 1; color: var(--primary); }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(to bottom, rgba(10,10,12,0) 0%, rgba(10,10,12,1) 90%), 
                        url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }

        h1 { font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; line-height: 1; margin-bottom: 20px; text-transform: uppercase; }
        .highlight { background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .player-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .now-playing { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); margin-bottom: 10px; display: block; }
        .track-info { font-weight: 700; font-size: 1.2rem; margin-bottom: 20px; }

        audio { width: 100%; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }

        .schedule { padding: 100px 10%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; transition: 0.3s; }
        footer { padding: 40px; text-align: center; opacity: 0.5; font-size: 0.9rem; }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Blokada prawego przycisku myszy -->

    <div class="blob"></div>

    <nav>
        <div class="logo">Radio <span>Mix FM</span></div>
        <ul class="nav-links">
            <li><a href="#">Start</a></li>
            <li><a href="ramowka.html">Ramówka</a></li>
            <li><a href="#">Podcasty</a></li>
            <li><a href="#">Kontakt</a></li>
        </ul>
    </nav>

    <header>
        <h1>Maximum <br><span class="highlight">Volume</span></h1>
        <p>Najlepsze miksy, 24/7 bez przerwy.</p>

        <div class="player-box">
            <span class="now-playing">TRANSMISJA JEST TESTOWA</span>
            <div class="track-info">Radio Mix FM - Maximum Volume</div>
            <audio id="radioPlayer" controls loop preload="auto" controlsList="nodownload noplaybackrate">
                <source src="radio.mp3" type="audio/mpeg">
                Twoja przeglądarka nie obsługuje odtwarzacza audio.
            </audio>
        </div>
    </header>

    <section class="schedule">
        <h2>Nadchodzące audycje</h2>
        <div class="grid">
            <div class="card">
                <h3>WKRÓTCE</h3>
                <p>start stacji</p>
            </div>
        </div>
    </section>

    <footer>
        &copy; 2026 Radio Mix FM. Wszystkie prawa zastrzeżone.
    </footer>

    <!-- SKRYPTY ZABEZPIECZAJĄCE I AUDIO -->
    <script>
        const audio = document.getElementById('radioPlayer');

        // Autoplay po kliknięciu
        document.body.addEventListener('click', function() {
            if (audio.paused) { audio.play(); }
        }, { once: true });

        // --- MODUŁ ZABEZPIECZEŃ ---

        // 1. Blokada skrótów klawiszowych (F12, Ctrl+Shift+I, Ctrl+U itd.)
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl + Shift + I (Inspect)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                e.preventDefault();
                return false;
            }
            // Ctrl + Shift + J (Console)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                e.preventDefault();
                return false;
            }
            // Ctrl + U (View Source)
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
                return false;
            }
            // Ctrl + S (Save)
            if (e.ctrlKey && e.keyCode === 83) {
                e.preventDefault();
                return false;
            }
        });

        // 2. Blokada prawego przycisku myszy (dodatkowa ochrona)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);

        // 3. Prosta ochrona przed Debuggerem (utrudnia analizę kodu)
        setInterval(function() {
            // debugger; // Opcjonalne: zatrzymuje stronę, jeśli konsola jest otwarta
        }, 1000);

        console.log("%cRadio Mix FM - Dostęp zabroniony!", "color: red; font-size: 20px; font-weight: bold;");
    </script>

</body>
</html>
